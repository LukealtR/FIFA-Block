<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BlockBall — Mini Football</title>
<style>
:root{--bg:#07111f;--panel:#101e31;--lime:#a8f05a;--text:#edf5ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#142943,#07111f 65%);color:var(--text);font-family:system-ui,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:min(100%,980px);padding:18px 14px 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:clamp(25px,5vw,38px);margin:0;letter-spacing:-1px}.brand{color:var(--lime)}.sub{color:#9db2c9;font-size:13px;margin-top:3px}
.scorebox{display:flex;align-items:center;gap:14px;background:#102238;border:1px solid #29415d;border-radius:14px;padding:9px 16px;font-weight:800}.score{font-size:25px;font-variant-numeric:tabular-nums}.team{font-size:11px;color:#a9bdd2;text-align:center}
.gamewrap{background:#0b1727;border:1px solid #29415d;border-radius:18px;padding:10px;box-shadow:0 18px 55px #0006}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:11px;background:#27854b;touch-action:none}
.below{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;color:#b6c7d9;font-size:13px}
button{border:0;border-radius:11px;padding:10px 15px;font-weight:800;background:var(--lime);color:#10200a;cursor:pointer}
button.secondary{background:#1d344e;color:#eaf3ff;border:1px solid #38536e}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}
.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,40px);gap:5px}
.pad button,.kick{background:#1c3550;color:#fff;border:1px solid #46627d;padding:0;font-size:17px;touch-action:none;user-select:none}
.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.kick{height:84px;width:84px;border-radius:50%;background:#315a24;border-color:#8bc65a;font-size:13px;font-weight:900}
.tip{font-size:12px;color:#829bb4;text-align:center;margin-top:10px}
@media(min-width:700px){.mobile{display:none}}
@media(max-width:699px){main{padding:12px 9px}.controls{margin-top:10px}.scorebox{padding:7px 12px}.below{font-size:12px}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1><span class="brand">BLOCK</span>BALL</h1><div class="sub">Tiny players. Big football energy.</div></div>
    <div class="scorebox"><div><div class="team">YOU</div><div class="score" id="homeScore">0</div></div><div style="color:#718ba5">—</div><div><div class="team">CPU</div><div class="score" id="awayScore">0</div></div></div>
  </div>
  <div class="gamewrap">
    <canvas id="pitch" width="960" height="540" aria-label="BlockBall football pitch"></canvas>
    <div class="below"><span id="status">Kick-off! Move with WASD or arrow keys.</span><button class="secondary" id="reset">New match</button></div>
  </div>
  <div class="controls mobile">
    <div class="pad" aria-label="Movement controls">
      <button class="up" data-key="ArrowUp">▲</button><button class="left" data-key="ArrowLeft">◀</button><button class="down" data-key="ArrowDown">▼</button><button class="right" data-key="ArrowRight">▶</button>
    </div>
    <button class="kick" data-key="Space">KICK<br>⚽</button>
  </div>
  <div class="tip">Desktop: WASD / arrow keys to move · Space to kick · First to 5 wins · Mobile: use the buttons</div>
</main>
<script>
(()=>{
const c=document.getElementById('pitch'),ctx=c.getContext('2d'),W=960,H=540;
const keys=new Set();let home=0,away=0,ended=false,last=0,goalPause=0;
const status=document.getElementById('status');
const player={x:235,y:270,vx:0,vy:0,r:17,speed:245,color:'#4aa8ff',number:'10'};
const cpu={x:725,y:270,vx:0,vy:0,r:17,speed:176,color:'#ff626b',number:'9'};
const ball={x:480,y:270,vx:0,vy:0,r:10};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resetPositions(){player.x=235;player.y=270;player.vx=player.vy=0;cpu.x=725;cpu.y=270;cpu.vx=cpu.vy=0;ball.x=480;ball.y=270;ball.vx=ball.vy=0;goalPause=0;}
function reset(){home=away=0;ended=false;document.getElementById('homeScore').textContent='0';document.getElementById('awayScore').textContent='0';status.textContent='Kick-off! Move with WASD or arrow keys.';resetPositions();}
function goal(team){if(team==='home'){home++;status.textContent='GOAL! Nice shot.'}else{away++;status.textContent='CPU scored! Get it back.'}document.getElementById('homeScore').textContent=home;document.getElementById('awayScore').textContent=away;goalPause=1.1;if(home>=5||away>=5){ended=true;status.textContent=home>=5?'YOU WIN! Press New match to play again.':'CPU WINS! Press New match to try again.'}}
function move(p,dx,dy,dt){let n=Math.hypot(dx,dy)||1;p.vx=dx/n*p.speed;p.vy=dy/n*p.speed;p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=clamp(p.x,45,915);p.y=clamp(p.y,45,495)}
function collide(p){let dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy)||1,min=p.r+ball.r;if(d<min){let nx=dx/d,ny=dy/d,over=min-d;ball.x+=nx*over;ball.y+=ny*over;ball.vx+=nx*85+p.vx*.22;ball.vy+=ny*85+p.vy*.22}}
function update(dt){
 if(ended)return;if(goalPause>0){goalPause-=dt;if(goalPause<=0)resetPositions();return}
 let dx=0,dy=0;if(keys.has('ArrowLeft')||keys.has('a')||keys.has('A'))dx--;if(keys.has('ArrowRight')||keys.has('d')||keys.has('D'))dx++;if(keys.has('ArrowUp')||keys.has('w')||keys.has('W'))dy--;if(keys.has('ArrowDown')||keys.has('s')||keys.has('S'))dy++;
 move(player,dx,dy,dt);
 // Simple low-cost opponent AI: chase the ball, then drift toward the centre.
 let tx=ball.x,ty=ball.y;if(ball.x<500){tx=ball.x+20}else{tx=510;ty=270+(ball.y-270)*.25}
 let adx=tx-cpu.x,ady=ty-cpu.y,dist=Math.hypot(adx,ady);move(cpu,dist>12?adx:0,dist>12?ady:0,dt);
 collide(player);collide(cpu);
 if(keys.has('Space')||keys.has(' ')){let d=Math.hypot(ball.x-player.x,ball.y-player.y);if(d<68){let ax=ball.x-player.x,ay=ball.y-player.y,n=Math.hypot(ax,ay)||1;ball.vx=ax/n*510+90;ball.vy=ay/n*510;}}
 // CPU taps the ball toward the player's goal.
 if(Math.hypot(ball.x-cpu.x,ball.y-cpu.y)<36){let ax=45-ball.x,ay=270-ball.y,n=Math.hypot(ax,ay)||1;ball.vx+=ax/n*260*dt;ball.vy+=ay/n*260*dt}
 ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.986,dt*60);ball.vy*=Math.pow(.986,dt*60);
 if(ball.y<25||ball.y>515){ball.y=clamp(ball.y,25,515);ball.vy*=-.78}
 // Goals are openings in the end walls.
 if(ball.x<28&&ball.y>205&&ball.y<335){goal('away');return}
 if(ball.x>932&&ball.y>205&&ball.y<335){goal('home');return}
 if(ball.x<28||ball.x>932){ball.x=clamp(ball.x,28,932);ball.vx*=-.8}
}
function square(x,y,size,color){ctx.fillStyle=color;ctx.fillRect(x-size/2,y-size/2,size,size);ctx.fillStyle='#ffffff33';ctx.fillRect(x-size/2,y-size/2,size,4);ctx.strokeStyle='#07111f';ctx.lineWidth=3;ctx.strokeRect(x-size/2,y-size/2,size,size)}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#27854b';ctx.fillRect(0,0,W,H);
 for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#ffffff08':'#00000008';ctx.fillRect(i*96,0,96,H)}
 ctx.strokeStyle='#ffffffaa';ctx.lineWidth=4;ctx.strokeRect(24,24,912,492);ctx.beginPath();ctx.moveTo(480,24);ctx.lineTo(480,516);ctx.stroke();ctx.beginPath();ctx.arc(480,270,78,0,Math.PI*2);ctx.stroke();
 ctx.strokeRect(24,165,120,210);ctx.strokeRect(816,165,120,210);ctx.strokeRect(24,215,42,110);ctx.strokeRect(894,215,42,110);
 ctx.fillStyle='#dbeafe';ctx.fillRect(0,205,24,130);ctx.fillRect(936,205,24,130);
 // Players are deliberately simple square sprites.
 square(player.x,player.y,34,player.color);square(cpu.x,cpu.y,34,cpu.color);
 ctx.fillStyle='white';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText('10',player.x,player.y+5);ctx.fillText('9',cpu.x,cpu.y+5);
 ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#182536';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(ball.x,ball.y,3,0,Math.PI*2);ctx.fillStyle='#182536';ctx.fill();
}
function loop(t){let dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key);if(e.key===' ')keys.add('Space')});
window.addEventListener('keyup',e=>{keys.delete(e.key);if(e.key===' ')keys.delete('Space')});
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;const down=e=>{e.preventDefault();keys.add(k)};const up=e=>{e.preventDefault();keys.delete(k)};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
document.getElementById('reset').addEventListener('click',reset);reset();requestAnimationFrame(loop);
})();
</script>
</body></html>
